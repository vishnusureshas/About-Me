services:
  # --- Redis: caching + session store ---
  redis:
    image: redis:7-alpine
    container_name: my-profile-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    networks:
      - my-profile-net
    command: redis-server --appendonly yes --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- Backend: Express (scale with --scale server=3) ---
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # container_name removed to allow scaling; use service name
    restart: unless-stopped
    expose:
      - "5000"
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      # Override REDIS_URL to use compose network (keep Atlas MONGODB_URI from .env)
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - FRONTEND_URL=http://localhost
      - SESSION_SECRET=my-dev-secret-please-change-in-production-32chars!
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # No bind mount for prod; use named volume for logs if needed
      - server_logs:/app/logs
    networks:
      - my-profile-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Frontend: Next.js ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: my-profile-web
    restart: unless-stopped
    # Expose only via nginx in prod; keep 3000 for direct dev access
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_healthy
    networks:
      - my-profile-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- NGINX: reverse proxy + load balancer (port 80) ---
  nginx:
    image: nginx:1.25-alpine
    container_name: my-profile-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # uncomment when SSL certs mounted
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      # - ./certs:/etc/nginx/certs:ro  # for SSL
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - my-profile-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local
    name: my-profile-redis-data
  server_logs:
    driver: local
    name: my-profile-server-logs
  nginx_cache:
    driver: local
    name: my-profile-nginx-cache

networks:
  my-profile-net:
    driver: bridge
    name: my-profile-net
