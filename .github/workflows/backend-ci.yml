name: Backend CI/CD

on:
  push:
    branches: [master, main]
    paths:
      - "server/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: node --check server.js
      - run: node --check routes/contacts.js
      - run: node --check config/redis.js
      - run: node --check middleware/cache.js
      - run: node --check middleware/rateLimitRedis.js
      - run: node --check middleware/session.js

      - name: Docker build test (backend)
        run: docker build -t my-profile-server:ci -f Dockerfile .

      - name: Create CI stub env for compose validation
        working-directory: ${{ github.workspace }}
        run: cp server/.env.example server/.env

      - name: Docker Compose validate
        working-directory: ${{ github.workspace }}
        run: docker compose config --quiet

      # Optional: Deploy to Render (add RENDER_DEPLOY_HOOK_URL secret, uncomment)
      # - name: Trigger Render Deploy Hook
      #   if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      #   run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # Optional: Push image to GHCR
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # - run: docker tag my-profile-server:ci ghcr.io/${{ github.repository }}/server:${{ github.sha }}
      # - run: docker push ghcr.io/${{ github.repository }}/server:${{ github.sha }}
