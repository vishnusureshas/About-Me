# NGINX reverse proxy + load balancer for my-profile
# Routes: /api/ -> backend, / -> frontend, SSL termination, rate limit, caching
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    upstream backend {
        # Least connections is better for variable latency (Mongo + Redis)
        least_conn;
        server server:5000 max_fails=3 fail_timeout=30s;
        # Scale horizontally: add replicas and uncomment
        # server server2:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Rate limiting zone (mirrors app rateLimiter 5/15min for /api/contacts but at edge)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;

    # Proxy cache for GET /api/contacts (mirrors Redis cache 60s, edge cache)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m inactive=60s use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Frontend — Next.js
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache off;
    }

    # Backend health — no cache, no rate limit
    location = /api/health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
    location = /api/session {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Contacts API — rate limited + cached GET
    location /api/contacts {
        limit_req zone=api burst=5 nodelay;
        # GET cache
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass session cookie
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # All other /api
    location /api/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block hidden files
    location ~ /\. { deny all; access_log off; log_not_found off; }
}

    # HTTPS template (uncomment when certs mounted at /etc/nginx/certs)
    # server {
    #     listen 443 ssl http2;
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     include /etc/nginx/conf.d/options-ssl-nginx.conf;
    #     # ... same locations as above ...
    # }
}
